spring.application.name=langchain4j_springboot
langchain4j.community.dashscope.chat-model.api-key=${ALI_AI_KEY}
langchain4j.community.dashscope.chat-model.model-name=qwen-max


langchain4j.community.dashscope.streaming-chat-model.api-key=${ALI_AI_KEY}
# qwq-32b  deepseek 都不支持function call(deepseek-v3)
langchain4j.community.dashscope.streaming-chat-model.model-name= qwen-max


langchain4j.community.dashscope.embedding-model.api-key=${ALI_AI_KEY}
#langchain4j.community.dashscope.embedding-model.model-name=
# 注：默认 embedding 模型为 text-embedding-v2，维度 1536；若改 model-name，collection 维度必须同步修改


# ===== Qdrant 向量库（Windows 原生）=====
# gRPC 端口（langchain4j 读写向量用）
qdrant.host=localhost
qdrant.port=6334
# REST 端口（启动初始化建 collection 用）
qdrant.rest-port=6333
qdrant.collection-name=langchain4j_demo
# 向量维度：0 = 自动探测（推荐，随 embedding 模型变化自动适配）；手动指定则写具体数字（如 1536/1024）
qdrant.dimension=0

# ===== RAG 拓扑策略开关（对比演示）=====
# isolated = 每业务一个独立 collection（legal_docs / product_docs），物理隔离
# shared   = 单一 collection（shared_docs）+ source payload 过滤，灵活共享
rag.strategy=shared
rag.legal.collection=legal_docs
rag.product.collection=product_docs
rag.shared.collection=shared_docs

# MySQL 数据源（对话记忆持久化）
spring.datasource.url=jdbc:mysql://localhost:3306/ai-learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver